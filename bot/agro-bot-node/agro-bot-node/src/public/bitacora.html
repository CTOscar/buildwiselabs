<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora del campo - La Pedregoza</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=2">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
<script>
  try {
    if (localStorage.getItem('agro_bot_tema') === 'oscuro') {
      document.documentElement.classList.add('dark');
    }
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.1c2d74a6.css">
</head>
<body class="con-rail bg-stone-50 min-h-screen text-stone-800 pb-16">

<nav class="rail" aria-label="Navegacion principal">
  <a href="/bot-web" class="rail-logo" title="La Pedregoza"><img src="/img/mango-logo.png" alt="La Pedregoza"></a>
  <a href="/bot-web" class="rail-item" title="Bot de captura">
    <span class="rail-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg></span>
    Bot
  </a>
  <a href="/actividad-en-vivo" class="rail-item" title="Actividad en vivo">
    <span class="rail-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>
    Actividad
  </a>
  <a href="/bitacora" class="rail-item activa" title="Bitacora diaria del campo">
    <span class="rail-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></span>
    Bitácora
  </a>
  <a href="/monitoreo" class="rail-item" title="Monitoreo de modelos">
    <span class="rail-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg></span>
    Monitoreo
  </a>
  <a href="/usuarios" id="railUsuarios" class="rail-item" title="Usuarios" hidden>
    <span class="rail-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
    Usuarios
  </a>
  <div class="rail-fin" title="Hecho por BuildWise Labs"><img src="/img/mark.png" alt="BuildWise Labs"></div>
</nav>


<header class="bg-white border-b border-stone-100 shadow-sm px-4 sm:px-6 py-4">
  <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
    <a href="/bot-web" class="text-stone-400 hover:text-stone-600 text-sm shrink-0">&larr; Volver</a>
    <div class="flex items-center gap-2 min-w-0">
      <img src="/img/pedregoza-logo.png" alt="La Pedregoza" class="h-7 w-auto shrink-0">
      <span class="font-semibold text-stone-800 tracking-tight whitespace-nowrap">Bitácora del campo</span>
    </div>
    <button id="btnTema" type="button" title="Cambiar tema" aria-label="Cambiar tema"
      class="btn-tactile shrink-0 w-9 h-9 rounded-full flex items-center justify-center bg-stone-50 hover:bg-stone-100 border border-stone-200 dark:border-stone-700 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-600 dark:text-stone-300 transition"></button>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 pt-5 space-y-4">

  <!-- Selector de dia -->
  <section class="card p-4 flex items-center justify-between gap-3 flex-wrap">
    <div class="flex items-center gap-2 min-w-0">
      <span class="icono-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
      <div class="min-w-0">
        <h1 class="font-semibold text-stone-800">Bitácora diaria</h1>
        <p id="diaTexto" class="text-xs text-stone-400">&mdash;</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="btnDiaAnterior" type="button" class="bitacora-nav" title="Día anterior" aria-label="Día anterior">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <input id="inputDia" type="date"
        class="border border-stone-200 rounded-md px-3 py-1.5 text-sm bg-stone-50 focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white">
      <button id="btnDiaSiguiente" type="button" class="bitacora-nav" title="Día siguiente" aria-label="Día siguiente">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button id="btnHoy" type="button" class="btn-tactile bg-stone-900 hover:bg-black text-white font-semibold rounded-md px-3 py-1.5 text-sm transition">Hoy</button>
    </div>
  </section>

  <!-- Totales del dia -->
  <section id="totales" class="grid grid-cols-2 md:grid-cols-4 gap-3"></section>

  <!-- Aviso (sin base de datos, error, dia vacio) -->
  <div id="avisoBitacora" class="card p-5 text-sm text-stone-500" hidden></div>

  <!-- Una tarjeta por huerta -->
  <section id="huertas" class="space-y-4">
    <div class="card p-5 space-y-2">
      <div class="skeleton-line w-1/3"></div>
      <div class="skeleton-line w-2/3"></div>
      <div class="skeleton-line w-1/2"></div>
    </div>
  </section>
</main>

<script defer src="/js/dist/bitacora.f90f5c88.bundle.js"></script>
</body>
</html>
