<head>

</head>

    Bot
  </a>
  <a href="/actividad-en-vivo" class="rail-item" title="Actividad en vivo">
    <span class="rail-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>
    Actividad
  </a>
  <a href="/bitacora" class="rail-item" title="Bitacora diaria del campo">
    <span class="rail-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></span>
    Bitácora

  <a href="/monitoreo" class="rail-item" title="Monitoreo de modelos">
    <span class="rail-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg></span>
    Monitoreo
  </a>
  <a href="/usuarios" id="railUsuarios" class="rail-item activa" title="Usuarios">
    <span class="rail-icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
    Usuarios
  </a>
  <div class="rail-fin" title="Hecho por BuildWise Labs"><img src="/img/mark.png" alt="BuildWise Labs"></div>

<div class="max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2">
      <img src="/img/mango-logo.png" alt="La Pedregoza" class="w-7 h-7 object-contain">
      <span class="font-semibold text-stone-700 tracking-tight">La Pedregoza · Usuarios</span>
    </div>
    <a href="/bot-web" class="text-sm text-stone-500 hover:text-stone-800">&larr; Volver al bot</a>
  </div>

  <div class="bg-white rounded-3xl shadow-sm border border-stone-100 p-6 mb-6">
    <h1 class="text-lg font-bold text-stone-800 mb-1 flex items-center gap-2"><span class="icono-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span>Crear usuario nuevo</h1>
    <p class="text-sm text-stone-400 mb-4">Solo cuentas de administrador pueden ver esta pagina.</p>

    <form id="formCrear" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <input type="text" id="cNombre" placeholder="Nombre completo" required
        class="border border-stone-200 rounded-full px-4 py-2.5 text-sm bg-stone-50 focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white">
      <input type="text" id="cUsuario" placeholder="Usuario (para iniciar sesion)" required
        class="border border-stone-200 rounded-full px-4 py-2.5 text-sm bg-stone-50 focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white">
      <input type="email" id="cEmail" placeholder="Correo (opcional)"
        class="border border-stone-200 rounded-full px-4 py-2.5 text-sm bg-stone-50 focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white">
      <input type="password" id="cPassword" placeholder="Contraseña (min. 6 caracteres)" required
        class="border border-stone-200 rounded-full px-4 py-2.5 text-sm bg-stone-50 focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white">
      <select id="cRol"
        class="border border-stone-200 rounded-full px-4 py-2.5 text-sm bg-stone-50 focus:outline-none focus:ring-2 focus:ring-green-500 focus:bg-white sm:col-span-2">
        <option value="usuario">Usuario normal (captura reportes)</option>
        <option value="admin">Administrador (puede crear/gestionar usuarios)</option>
      </select>
      <button type="submit"
        class="sm:col-span-2 bg-stone-900 hover:bg-black text-white font-semibold rounded-full py-2.5 text-sm transition">
        Crear usuario
      </button>
    </form>
    <div id="msgCrear" class="mt-3 text-sm text-center" hidden></div>
  </div>

  <div class="bg-white rounded-3xl shadow-sm border border-stone-100 p-6">
    <h2 class="text-lg font-bold text-stone-800 mb-4 flex items-center gap-2"><span class="icono-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>Equipo</h2>
    <div id="listaUsuarios" class="space-y-2"></div>
  </div>
</div>

<script>
// Quien tiene la sesion abierta. Se usa para marcar su propia fila y no ofrecerle botones
// que el servidor va a rechazar de todas formas (cambiarse el rol o desactivarse solo).
let yoId = null;
fetch('/perfil').then((r) => r.json()).then((d) => { if (d.ok) yoId = d.usuarioId; }).catch(() => {});

async function cargarUsuarios() {
  const res = await fetch('/admin/usuarios');
  const data = await res.json();
  const cont = document.getElementById('listaUsuarios');
  cont.innerHTML = '';
  if (!data.ok) {
    cont.innerHTML = '<p class="text-sm text-red-600">' + (data.mensaje || 'No se pudo cargar la lista.') + '</p>';
    return;
  }
  data.usuarios.forEach((u) => {
    const esYo = yoId !== null && u.id === yoId;
    const fila = document.createElement('div');
    fila.className = 'flex items-center justify-between border border-stone-100 rounded-2xl px-4 py-3';
    fila.innerHTML = `
      <div>
        <p class="text-sm font-semibold text-stone-800">${escapeHtml(u.nombre)} <span class="text-stone-400 font-normal">(${escapeHtml(u.usuario)})</span></p>
        <p class="text-xs text-stone-400">
          <span class="${u.rol === 'admin' ? 'font-semibold text-amber-700' : ''}">${u.rol === 'admin' ? 'Administrador' : 'Usuario'}</span>
          · ${u.activo ? 'Activo' : 'Desactivado'}${esYo ? ' · <span class="text-stone-500">tu cuenta</span>' : ''}
        </p>
      </div>
      <div class="flex gap-2 flex-wrap justify-end">
        <button data-id="${u.id}" class="btnPassword text-xs bg-stone-100 hover:bg-stone-200 rounded-full px-3 py-1.5">Resetear contraseña</button>
        ${esYo ? '' : `
        <button data-id="${u.id}" data-rol="${u.rol}" data-nombre="${escapeHtml(u.nombre)}" class="btnRol text-xs rounded-full px-3 py-1.5 ${u.rol === 'admin' ? 'bg-stone-100 text-stone-700 hover:bg-stone-200' : 'bg-amber-50 text-amber-800 hover:bg-amber-100'}">
          ${u.rol === 'admin' ? 'Quitar administrador' : 'Hacer administrador'}
        </button>
        <button data-id="${u.id}" data-activo="${u.activo}" class="btnActivo text-xs rounded-full px-3 py-1.5 ${u.activo ? 'bg-red-50 text-red-600 hover:bg-red-100' : 'bg-green-50 text-green-700 hover:bg-green-100'}">
          ${u.activo ? 'Desactivar' : 'Activar'}
        </button>`}
      </div>`;
    cont.appendChild(fila);
  });

  cont.querySelectorAll('.btnPassword').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const nueva = prompt('Nueva contraseña (min. 6 caracteres):');
      if (!nueva) return;
      const res = await fetch(`/admin/usuarios/${btn.dataset.id}/password`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: nueva }),
      });
      const data = await res.json();
      alert(data.ok ? 'Contraseña actualizada.' : (data.mensaje || 'Error.'));
    });
  });

  cont.querySelectorAll('.btnRol').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const esAdmin = btn.dataset.rol === 'admin';
      const nuevoRol = esAdmin ? 'usuario' : 'admin';

      // Dar permisos de administrador se confirma a proposito: quien los tenga podra ver la
      // bitacora completa, cerrar el bot para todos y crear o borrar cuentas.
      const aviso = esAdmin
        ? `¿Quitarle los permisos de administrador a ${btn.dataset.nombre}?\n\nDejara de ver la bitacora y la administracion de usuarios.`
        : `¿Hacer administrador a ${btn.dataset.nombre}?\n\nPodra ver la bitacora completa (quien capturo que y a que hora), los errores del servidor, cerrar el bot para todo el equipo y crear o borrar cuentas.`;
      if (!confirm(aviso)) return;

      const res = await fetch(`/admin/usuarios/${btn.dataset.id}/rol`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rol: nuevoRol }),
      });
      const data = await res.json();
      if (data.ok) cargarUsuarios();
      else alert(data.mensaje || 'Error.');
    });
  });

  cont.querySelectorAll('.btnActivo').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const activo = btn.dataset.activo === 'true';
      const res = await fetch(`/admin/usuarios/${btn.dataset.id}/activo`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ activo: !activo }),
      });
      const data = await res.json();
      if (data.ok) cargarUsuarios();
      else alert(data.mensaje || 'Error.');
    });
  });
}

function escapeHtml(v) {
  return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.getElementById('formCrear').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msgCrear');
  msg.hidden = true;
  const body = {
    nombre: document.getElementById('cNombre').value,
    usuario: document.getElementById('cUsuario').value,
    email: document.getElementById('cEmail').value,
    password: document.getElementById('cPassword').value,
    rol: document.getElementById('cRol').value,
  };
  const res = await fetch('/admin/usuarios', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  msg.hidden = false;
  msg.className = 'mt-3 text-sm text-center ' + (data.ok ? 'text-green-700' : 'text-red-600');
  msg.textContent = data.ok ? 'Usuario creado.' : (data.mensaje || 'No se pudo crear.');
  if (data.ok) {
    e.target.reset();
    cargarUsuarios();
  }
});

cargarUsuarios();
</script>
</body>
</html>
