# Ajuste de reglas para los escaneos de ZAP.
#
# Formato: <id de regla> <TAB> <IGNORE|WARN|FAIL> <TAB> (comentario)
# Se pasa con -c reglas.conf (ya lo hace escanear.ps1).
#
# Criterio: aqui SOLO se ignora lo que es ruido real del entorno de prueba. Lo que es un
# problema de verdad se deja en WARN aunque salga en cada reporte -- un hallazgo que molesta
# cada vez es lo que al final hace que se arregle. Si algo se ignora, el motivo va escrito.

10035	IGNORE	(HSTS: en local no hay HTTPS, asi que es ruido. En produccion esta cabecera SI deberia estar -- al escanear comanpackagrobot.com cambia esta linea a WARN.)
10096	IGNORE	(Marcas de tiempo en la respuesta: riesgo bajo y salen por todos lados en respuestas JSON normales.)
10109	IGNORE	(Aviso informativo de "aplicacion web moderna", no es un hallazgo.)

# --- Lo de abajo se deja en WARN a proposito: son limitaciones reales del bot hoy ---
10020	WARN	(Falta X-Frame-Options: la pagina se puede incrustar en un iframe ajeno.)
10021	WARN	(Falta X-Content-Type-Options.)
10038	WARN	(Falta Content-Security-Policy.)
10063	WARN	(Falta Permissions-Policy.)
10054	WARN	(Cookie sin SameSite.)
10010	WARN	(Cookie sin Secure -- esperado en local, exigible en produccion.)
90022	WARN	(Mensajes de error que revelan detalle interno. Ya se tapan contraseñas y llaves, pero conviene revisar cada caso.)
